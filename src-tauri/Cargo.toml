[package]
name = "dynamic-island"
version = "0.1.0"
description = "Dynamic Island para escritorio Windows"
authors = ["you"]
edition = "2021"

[lib]
name = "dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_Foundation",
    # SetWindowPos: mueve y redimensiona la isla en una sola operación.
    "Win32_UI_WindowsAndMessaging",
] }

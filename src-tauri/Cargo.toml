[package]
name = "dynamic-island"
version = "0.3.0"
description = "Dynamic Island para escritorio Windows"
authors = ["Raul Nuñez"]
license = "MIT"
edition = "2021"

[lib]
name = "dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }

[target."cfg(windows)".dependencies]
# Lectura de solo lectura de la base de datos de notificaciones de Windows, para
# la foto de perfil de los avisos (ver avatars.rs). `bundled` compila SQLite
# dentro de la app: no depende de ninguna DLL del sistema.
rusqlite = { version = "0.37", features = ["bundled"] }
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    # Leer las notificaciones de otras apps (UserNotificationListener) y el
    # nombre de la aplicación que las emite.
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Foundation_Collections",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_Foundation",
    # SetWindowPos: mueve y redimensiona la isla en una sola operación.
    "Win32_UI_WindowsAndMessaging",
    # SetWindowRgn y CreateRectRgn: recortan la ventana fija a la isla.
    "Win32_Graphics_Gdi",
    # DwmEnableBlurBehindWindow: reaplica la transparencia tras recortar.
    "Win32_Graphics_Dwm",
    # GetSystemPowerStatus: bateria y corriente, para el aviso del cargador.
    "Win32_System_Power",
    # WlanEnumInterfaces y WlanQueryInterface: red Wi-Fi actual, para el aviso
    # al conectarse.
    "Win32_NetworkManagement_WiFi",
    # INetworkListManager: saber si hay salida a internet, no solo red local.
    "Win32_Networking_NetworkListManager",
] }

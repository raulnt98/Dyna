[package]
name = "dynamic-island"
version = "0.5.0"
description = "Dynamic Island para escritorio Windows"
authors = ["Raul Nuñez"]
license = "MIT"
edition = "2021"

[lib]
name = "dynamic_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
serde_json = "1"
ureq = { version = "3.5", features = ["json", "platform-verifier"] }
# Codifica el icono de una aplicación clásica (shell_icon.rs). Ya la usa Tauri.
png = "0.18"

[target."cfg(windows)".dependencies]
# Lectura de solo lectura de la base de datos de notificaciones de Windows, para
# la foto de perfil de los avisos (ver avatars.rs). `bundled` compila SQLite
# dentro de la app: no depende de ninguna DLL del sistema.
rusqlite = { version = "0.37", features = ["bundled"] }
# `IIterable` para pasar la lista de propiedades adicionales al enumerar dispositivos (batteries.rs).
windows-collections = "0.3"
# La macro `interface` (IPolicyConfig en outputs.rs) genera rutas `windows_core::…`, así que la crate tiene que estar a la vista.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    # Leer las notificaciones de otras apps (UserNotificationListener) y el
    # nombre de la aplicación que las emite.
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Foundation_Collections",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # Salidas de audio con nombre (outputs.rs): el nombre amistoso del dispositivo y su lectura como texto.
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Com",
    "Win32_Foundation",
    # SetWindowPos: mueve y redimensiona la isla en una sola operación.
    "Win32_UI_WindowsAndMessaging",
    # SetWindowRgn y CreateRectRgn: recortan la ventana fija a la isla.
    "Win32_Graphics_Gdi",
    # DwmEnableBlurBehindWindow: reaplica la transparencia tras recortar.
    "Win32_Graphics_Dwm",
    # GetSystemPowerStatus: bateria y corriente, para el aviso del cargador.
    "Win32_System_Power",
    # IShellItemImageFactory: el icono de una aplicación clásica, como en el menú
    # Inicio (ver shell_icon.rs).
    "Win32_UI_Shell",
    # RegGetValueW: la clave del icono de bandeja que genera un aviso de globo.
    "Win32_System_Registry",
    # WlanEnumInterfaces y WlanQueryInterface: red Wi-Fi actual, para el aviso
    # al conectarse.
    "Win32_NetworkManagement_WiFi",
    # Dispositivos Bluetooth conectados, para el aviso al conectar o desconectar
    # (ver bluetooth.rs).
    # Ubicación actual para el tiempo (weather.rs).
    "Devices_Geolocation",
    # Nodos de dispositivo y sus propiedades: la batería de los dispositivos Bluetooth (batteries.rs).
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Devices_Bluetooth",
    "Devices_Enumeration",
    # Unidades extraíbles (usb.rs), el panel del portátil (brightness.rs), las
    # teclas de bloqueo (keys.rs) y el uso de CPU y memoria (sysstats.rs).
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    # INetworkListManager: saber si hay salida a internet, no solo red local.
    "Win32_Networking_NetworkListManager",
] }
